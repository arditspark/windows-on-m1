name: J313 isolated HAL stall diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing-arm64:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout accepted upstream source
        uses: actions/checkout@v4
        with:
          repository: paulsmir/windows-on-m1
          ref: 7c260ae8f84f7f898d3f9209c15e39b37565e217
          persist-credentials: false
      - name: Apply reviewed diagnostic patch
        shell: pwsh
        run: |
          $encodedPatch = ''
          $bytes = [Convert]::FromBase64String($encodedPatch)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/input-timing.patch", $bytes)
          $actual = (Get-FileHash "$env:RUNNER_TEMP/input-timing.patch" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '8a4ebed935e214c04fe91d2f5e99d5db186287ca4a836055b1c79a79b0ddbde1') { throw 'Patch hash mismatch' }
          git apply --check "$env:RUNNER_TEMP/input-timing.patch"
          if ($LASTEXITCODE) { throw 'Patch base mismatch' }
          git apply "$env:RUNNER_TEMP/input-timing.patch"
          if ($LASTEXITCODE) { throw 'Patch apply failed' }
          New-Item -ItemType Directory -Path timing-evidence | Out-Null
          git rev-parse HEAD | Set-Content timing-evidence/upstream-commit.txt
          git diff --binary | Set-Content -Encoding utf8 timing-evidence/source-diff.txt
          Copy-Item "$env:RUNNER_TEMP/input-timing.patch" timing-evidence/
      - name: Test timing accumulator on x64 host
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'C++ host compiler missing' }
          $dev = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $command = '"' + $dev + '" -arch=x64 && cl /nologo /W4 /WX /I drivers\apple-input\windows\include drivers\apple-input\windows\tests\apple_input_timing_test.c /Fe:timing-evidence\timing-test.exe && timing-evidence\timing-test.exe'
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE) { throw 'Timing tests failed' }
          'TIMING_ACCUMULATOR_TEST_OK' | Set-Content timing-evidence/timing-test-result.txt
      - name: Test actual stall probe with bounded kernel API shim
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dev = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $command = '"' + $dev + '" -arch=x64 && cl /nologo /W4 /WX /I drivers\apple-input\windows\tests\stall_probe_shim drivers\apple-input\windows\tests\apple_input_stall_probe_test.c /Fe:timing-evidence\stall-probe-test.exe && timing-evidence\stall-probe-test.exe'
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE) { throw 'Stall probe shim tests failed' }
          'STALL_PROBE_KERNEL_SHIM_TEST_OK' | Set-Content timing-evidence/stall-probe-test-result.txt
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - uses: NuGet/setup-nuget@v2
      - name: Restore official SDK and WDK
        run: nuget restore packages.config -PackagesDirectory packages
      - name: Expose WDK host tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe | Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (!$stampInf) { throw 'stampinf.exe missing' }
          $stampInf.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build ARM64 diagnostic driver with code analysis
        run: msbuild drivers\apple-input\windows\AppleInput.vcxproj /m /t:Clean,Build /p:Configuration=Debug /p:Platform=ARM64 /p:RunCodeAnalysis=true
      - name: Build ARM64 diagnostic reader
        run: msbuild drivers\apple-input\windows\tools\AppleInputDiag\AppleInputDiag.vcxproj /m /t:Clean,Build /p:Configuration=Debug /p:Platform=ARM64
      - name: Record generated package hashes
        shell: pwsh
        run: |
          Get-ChildItem drivers/apple-input/windows/ARM64/Debug,drivers/apple-input/windows/tools/AppleInputDiag/ARM64/Debug -Recurse -File | Where-Object { $_.Extension -in '.sys','.inf','.cat','.exe' } | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content timing-evidence/package-hashes.json
      - name: Preserve build evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: J313-Input-Stall-Probe-Evidence
          path: timing-evidence/
      - name: Upload diagnostic ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: J313-AppleInput-Stall-Probe-ARM64-Debug
          if-no-files-found: error
          path: |
            drivers/apple-input/windows/ARM64/Debug/**/*.sys
            drivers/apple-input/windows/ARM64/Debug/**/*.inf
            drivers/apple-input/windows/ARM64/Debug/**/*.cat
            drivers/apple-input/windows/ARM64/Debug/**/*.pdb
            drivers/apple-input/windows/tools/AppleInputDiag/ARM64/Debug/**/*.exe
            drivers/apple-input/windows/tools/AppleInputDiag/ARM64/Debug/**/*.pdb
